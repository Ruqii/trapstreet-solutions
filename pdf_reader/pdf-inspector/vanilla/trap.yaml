name: pdf-reader-pdf-inspector-vanilla
# pdf-inspector as its README shows it: process_pdf().markdown. It has no OCR, so it cannot route around this PDF's -29-shifted DocuSign font subset and returns mojibake in 34ms. Near-zero here is the honest measurement of the library on this document, not a misconfiguration.
# Shared solution.py one level up; this dir carries only the mode + model, so the
# two variants cannot drift apart in anything except the thing being compared.
cmd: uv run python ../solution.py --mode vanilla --model claude-sonnet-4-6
profile:
  model: claude-sonnet-4-6
  framework: pdf-inspector
timeout: 600
tasks:
  pdf-reader-v2:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@0022f1061e9208ea84603b86a8720f2239f31b2c#subdirectory=tasks/pdf_reader_v2
