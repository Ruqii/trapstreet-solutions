name: pdf-reader-docling-ocr
# docling configured: OcrMode.FULL_PAGE. Still docling's own pipeline, no external library. Measured ~1050s and 5/8 gold strings — readable prose, but the tiered rents, 13.2%, 144 and 480 are lost, so the numeric cases should fail.
# Shared solution.py one level up; this dir carries only the mode + model, so the
# three variants cannot drift apart in anything except the thing being compared.
cmd: uv run python ../solution.py --mode ocr --model claude-sonnet-4-6
profile:
  model: claude-sonnet-4-6
  framework: docling
timeout: 2400
tasks:
  pdf-reader-v2:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@ae4bf6f84276a8a461f9dd44a70086f680ba9729#subdirectory=tasks/pdf_reader_v2
