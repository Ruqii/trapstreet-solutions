name: pdf-reader-docling-raster
# docling with the routing decision taken away from it: PyMuPDF renders pages to PNG first, so there is no text layer left to mistrust. Read this score as 'docling plus engineering', not as docling — the gap to the vanilla variant is how much external work the library needs here.
# Shared solution.py one level up; this dir carries only the mode + model, so the
# three variants cannot drift apart in anything except the thing being compared.
cmd: uv run python ../solution.py --mode raster --model claude-sonnet-4-6
profile:
  model: claude-sonnet-4-6
  framework: docling
timeout: 2400
tasks:
  pdf-reader-v2:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@ae4bf6f84276a8a461f9dd44a70086f680ba9729#subdirectory=tasks/pdf_reader_v2
