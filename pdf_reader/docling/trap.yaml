name: pdf-reader-docling
# Model is a literal CLI argument, never an env var — profile.model below is
# self-reported and would drift from a MODEL env var silently, putting the
# wrong engine in the leaderboard's ENGINE column.
cmd: uv run python solution.py --model claude-sonnet-4-6
profile:
  model: claude-sonnet-4-6
  framework: docling
# First case converts the PDF (OCR over 16 pages, plus a rasterisation retry if
# the direct path returns mojibake — it does on this document) and caches the
# markdown in /tmp/trapstreet-docling-cache by content hash. Later cases are a
# plain LLM call. Generous ceiling for the cold first case.
timeout: 1800
tasks:
  pdf-reader-v2:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@0022f1061e9208ea84603b86a8720f2239f31b2c#subdirectory=tasks/pdf_reader_v2
