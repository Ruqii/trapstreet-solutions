# One solution, many models: MODEL env var picks the engine (Anthropic direct, or
# anything else via OpenRouter). Set MODEL before `tp run` — it also decides what
# `profile.model` below should say for the run you're about to submit.
name: mbti-multi-model
profile:
  model: claude-opus-4-7

setup_cmd: uv sync
cmd: uv run python solution.py
timeout: 600 # heavy reasoning models can take well over a minute

tasks:
  mbti-profile: # alias doubles as the trapstreet task_id on submit
    # Pinned, not a local path. Two reasons: a local checkout with any unrelated
    # edit in it reports provenance.task as unanchored, and the leaderboard hides
    # unanchored runs — you'd pay for the run and get nothing rankable. And submit
    # matches this commit EXACTLY against the registered version, so running the
    # pin is the only way to know the run is submittable before spending the money.
    # Must be kept equal to whatever mbti-profile is registered at on trapstreet.
    source: git+https://github.com/trapstreet/trapstreet-tasks@8a6b53f55f70b8cba09fe45f662063501c9a5420#subdirectory=tasks/personality/mbti_profile
