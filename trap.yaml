# Two env vars pick the run:
#   MODEL   — which engine (Anthropic direct, or anything else via OpenRouter)
#   PERSONA — which personas/<name>.md is prepended, or "bare" for the control
#
# Both travel to the board through usage.json, so a run is labelled with what it
# actually was. They have to: trapstreet keys a solution on (commit, repo_path)
# alone, so every run from this commit shares one row identity no matter what the
# environment said, and `name:` below is recorded once and never overwritten.
name: mbti-multi-model
profile:
  model: claude-opus-4-7

setup_cmd: uv sync
cmd: uv run python solution.py
timeout: 600 # heavy reasoning models can take well over a minute

tasks:
  # The alias is the task handle for `tp submit --task`. The server resolves the
  # task by the commit below, not by this name, but keeping them equal avoids
  # confusion. Must stay equal to the commit registered on trapstreet — submit
  # matches {repo, commit, subdirectory} exactly and 404s on any mismatch.
  do-llms-dream-of-intj:
    source: git+https://github.com/trapstreet/trapstreet-tasks@792617f8ec46d4585046e15dc771ca14f020b710#subdirectory=tasks/personality/mbti_profile
