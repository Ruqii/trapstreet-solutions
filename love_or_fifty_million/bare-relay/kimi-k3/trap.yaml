# The model is a literal argument here and nowhere else, so what runs and what
# the board reports cannot drift apart.
name: bare-relay-kimi-k3
cmd: uv run ../solution.py --provider moonshot --model kimi-k3
profile:
  model: kimi-k3
  framework: moonshot
timeout: 300
tasks:
  # Must stay equal to the commit registered on trapstreet — submit matches
  # {repo, commit, subdirectory} exactly and 404s on any mismatch.
  love-or-fifty-million:
    source: git+https://github.com/trapstreet/trapstreet-tasks@a55d32016bdee33f192cc2f8b1000f572fa3b4bb#subdirectory=tasks/love_or_fifty_million
