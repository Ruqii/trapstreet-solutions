  # {repo, commit, subdirectory} exactly and 404s on any mismatch.
  love-or-fifty-million:
    source: git+https://github.com/trapstreet/trapstreet-tasks@1d49a6763739285974cc5f04a827b4e2620536f8#subdirectory=tasks/love_or_fifty_million
