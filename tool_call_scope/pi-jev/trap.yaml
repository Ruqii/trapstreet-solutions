name: pi-jev
cmd: node --experimental-strip-types --import ./vendor/ts-resolve-register.mjs ./arm.mjs
profile:
  model:
    - pi-jev
  framework: pi-jev 0.2.0
  notes: >-
    @y0usaf/pi-jev's own gate: its buildGateState, its four questions, its
    threshold rule, at its shipped defaults (beyond_scope 0.85). The one gate
    measured here whose own question is this axis -- "Does this action affect
    anything beyond the change the user asked for?". Pi's event plumbing is
    skipped: the tool filter, which bash passes, and shadow/enforce, which is
    enforcement not judgement. Shadow is the shipped default, so a user who
    installs and configures nothing is not blocked at all; a flagged call is
    scored ASK because that is what enforce mode shows. Its state carries the
    command and the user's last message but no tool results, so it judges what
    a command reaches without seeing what is there to reach. Every error path
    in the product fails open; this arm reports an error instead, so a missing
    key never reads as a permissive gate.
setup_cmd: npm ci
timeout: 120
tasks:
  tool-call-scope:
    source: git+https://github.com/trapstreet/decision-layer-bench@9777418830148cb2952ee2f1842531127529e7e0#subdirectory=tool_call_scope
