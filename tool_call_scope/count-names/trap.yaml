name: count-names
cmd: python3 ../floor_arm.py --arm count-names
profile:
  model:
    - count names
  framework: no model
  notes: >-
    No model. If the request names no resource it asks; otherwise it compares
    how many rows the command would take against how many the request named.
    The strongest meaning-free rule we found: it is the line a gate has to beat
    before its score is evidence that it read anything.
timeout: 60
tasks:
  tool-call-scope:
    source: git+https://github.com/trapstreet/decision-layer-bench@9777418830148cb2952ee2f1842531127529e7e0#subdirectory=tool_call_scope
