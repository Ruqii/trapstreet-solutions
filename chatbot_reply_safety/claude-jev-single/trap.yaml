name: claude-jev-single
cmd: uv run ../solution.py --arm claude-jev-single
profile:
  model:
    - claude-sonnet-5
    - jev-1.13.0
  framework: claude-jev-single
  notes: >-
    Claude Sonnet 5 may call Jev (jev-1.13.0) once for the overall question, sees the probability, and gives its own final estimate. Claude at default settings; no refusal fallback (a refused case
    gets no answer, counts as a failed case).
timeout: 300
tasks:
  chatbot-reply-safety:
    source: git+https://github.com/trapstreet/trapstreet-tasks@37f026d51226e7dd62d3d832b7d6e32eaefe5630#subdirectory=tasks/chatbot_reply_safety
