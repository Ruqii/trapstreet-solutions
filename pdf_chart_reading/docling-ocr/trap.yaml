name: docling-ocr
# OCR pipeline. It rasterises and re-reads every page, so it reaches the figure
# pages — the open question is what OCR returns from a chart that prints no
# numbers.
#
# Model is a literal CLI argument, never an env var — profile.model below is
# self-reported and would drift from a MODEL env var silently.
cmd: uv run python ../../pdf_reader/docling/solution.py --mode ocr --model claude-sonnet-5
profile:
  model: claude-sonnet-5
  framework: docling
timeout: 3600
tasks:
  # Alias must equal the trapstreet task_id — it is what `tp submit` submits to.
  pdf-chart-reading:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@8b42ce060c5790ea3065f721443f22c93a315b86#subdirectory=tasks/pdf_chart_reading
