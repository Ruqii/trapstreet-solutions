name: pdf-inspector
# The library's headline API (process_pdf().markdown), stopping at extraction.
# Pairs with pdf-inspector-routed to isolate what acting on its OCR verdict is
# worth when the pages it flags hold charts rather than text.
#
# The shared implementation ships a system prompt naming the UK tenancy
# agreement it was written for. Passing --system replaces it with neutral
# wording; the default is untouched, so the tenancy tasks stay reproducible.
#
# Model is a literal CLI argument, never an env var — profile.model below is
# self-reported and would drift from a MODEL env var silently.
cmd: uv run python ../../pdf_reader/pdf-inspector/solution.py --mode vanilla --model claude-sonnet-5 --system "You answer questions about a document. You are given it as plain text extracted from the PDF; layout may be flattened and the extraction may contain errors. Answer only from the document. Commit to an answer rather than hedging when the document contains it. Follow any format the question asks for, and answer every part of a multi-part question."
profile:
  model: claude-sonnet-5
  framework: pdf-inspector
timeout: 900
tasks:
  # Alias must equal the trapstreet task_id — it is what `tp submit` submits to.
  pdf-chart-reading:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@8b42ce060c5790ea3065f721443f22c93a315b86#subdirectory=tasks/pdf_chart_reading
