name: pdf-inspector
# The library's headline API (process_pdf().markdown), stopping at extraction.
# Pairs with pdf-inspector-routed to isolate what acting on its OCR verdict is
# worth when the pages it flags hold charts rather than text.
#
# Model is a literal CLI argument, never an env var — profile.model below is
# self-reported and would drift from a MODEL env var silently.
cmd: uv run python ../../pdf_reader/pdf-inspector/solution.py --mode vanilla --model claude-sonnet-5
profile:
  model: claude-sonnet-5
  framework: pdf-inspector
timeout: 900
tasks:
  # Alias must equal the trapstreet task_id — it is what `tp submit` submits to.
  pdf-chart-reading:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@8b198fb865f2315d80c9d5d7c85d69ba0b800994#subdirectory=tasks/pdf_chart_reading
