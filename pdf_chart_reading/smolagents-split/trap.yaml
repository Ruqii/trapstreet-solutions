# The only arm here that can choose its own method. A CodeAgent with a vision
# tool and a Python interpreter, planning on Sonnet 5 and looking with Opus 5 --
# the split is motivated by this task's own result, where the same pipeline
# reading bar heights scored 0.9 on Opus against 0.5-0.7 on Sonnet.
#
# The interpreter is given the document-analysis modules anyone doing this work
# in Python would have, and told where the file is. That is the experiment:
# every other arm has its method chosen by whoever wrote it, and this one is
# asked whether an agent finds a method at all. Nothing in its brief mentions
# bars, gridlines or measurement.
#
# 12 steps rather than the file's default 6: a method it has to discover needs
# room to be discovered.
#
# --answer-contract exists because smolagents' final_answer is a value channel:
# asked for a count the model calls final_answer("6"), and a task grading on a
# sentinel line scores that zero however right the 6 is. The adapter emits the
# line; it does not change what the agent concluded.
name: smolagents-split
cmd: "uv run python ../../pdf_reader/smolagents-split/solution.py --planner-model claude-sonnet-5 --tool-model claude-opus-5 --max-steps 12 --answer-contract ANSWER --allow-imports \"pymupdf,PIL,PIL.Image,numpy,math,statistics,json,re,collections,itertools\" --tool-system \"You look at a document and report what a figure shows. Answer exactly what is there. One short sentence; just the value if a value is asked for.\" --agent-prompt \"You answer one question about a document whose figures are pictures: the pages carrying them have no text layer and no vector paths, so no parser can read a value out of them.\n\nYou have:\n  - read_pdf(question): ask a focused question, a vision model looks at the document\n  - Python: compute, and whatever else you can do with the modules listed below\n\nRules:\n- Answer ONLY from the document.\n- Do not hedge if the document contains the answer; if it genuinely cannot, say so and say why.\n- What you pass to final_answer() is the whole of what gets graded, so it must itself end with a line of the form `ANSWER: <value>` -- a bare value loses the case.\n\nQUESTION: {question}\""
profile:
  # Both models are literal CLI arguments, never env vars — profile.model is
  # self-reported and would drift silently. Listed in the order the cmd passes
  # them: Sonnet plans, Opus looks.
  model: [claude-sonnet-5, claude-opus-5]
  framework: smolagents
timeout: 3600
tasks:
  # Alias must equal the trapstreet task_id — it is what `tp submit` submits to.
  pdf-chart-reading:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@8b42ce060c5790ea3065f721443f22c93a315b86#subdirectory=tasks/pdf_chart_reading
