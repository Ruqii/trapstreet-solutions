name: claude-alone
cmd: uv run ../solution.py --arm claude-alone
profile:
  model:
    - claude-sonnet-5
  framework: claude-alone
  notes: >-
    Claude Sonnet 5 reads task.md and conversation.json and states a probability. No Jev. Claude at default settings; no refusal fallback (a refused case
    gets no answer, scored as 0.5).
timeout: 300
tasks:
  response-safety-calibration:
    source: git+https://github.com/trapstreet/trapstreet-tasks@PENDING_PUBLIC_COMMIT#subdirectory=tasks/response_safety_calibration
