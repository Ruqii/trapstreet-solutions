name: pdf-mixed-scan-mineru
# OCR pipeline. Rasterises and re-reads every page, so the image-only half
# is reachable. Roughly 17 minutes on CPU for this document; the cache in
# /tmp/trapstreet-mineru-cache must be COLD when `tp run` starts or the
# parse happens outside the measured window and the latency is understated
# by an order of magnitude.
#
# Model is a literal CLI argument, never an env var — profile.model below is
# self-reported and would drift from a MODEL env var silently.
cmd: uv run python ../../pdf_reader/mineru/solution.py --model claude-sonnet-5
profile:
  model: claude-sonnet-5
  framework: mineru
timeout: 3600
tasks:
  # Alias must equal the trapstreet task_id — it is what `tp submit` submits to.
  pdf-mixed-scan:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@6afe24b4173db4ffb4c83da81c7cc93ce8a50943#subdirectory=tasks/pdf_mixed_scan
