name: pdf-mixed-scan-pymupdf
# Text-layer control. Same strategy as pdf-inspector's markdown path but a
# different library, so the tier's score is attributable to the approach
# rather than to one implementation.
#
# Model is a literal CLI argument, never an env var — profile.model below is
# self-reported and would drift from a MODEL env var silently.
cmd: uv run python solution.py --model claude-sonnet-5
profile:
  model: claude-sonnet-5
  framework: pymupdf
timeout: 900
tasks:
  # Alias must equal the trapstreet task_id — it is what `tp submit` submits to.
  pdf-mixed-scan:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@6afe24b4173db4ffb4c83da81c7cc93ce8a50943#subdirectory=tasks/pdf_mixed_scan
