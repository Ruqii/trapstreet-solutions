name: pdf-mixed-scan-pdf-inspector
# The library's headline API (process_pdf().markdown). It reads the text
# layer only, so pages 6-11 of this document reach it as nothing at all —
# which is the axis the task measures.
#
# Model is a literal CLI argument, never an env var — profile.model below is
# self-reported and would drift from a MODEL env var silently.
cmd: uv run python ../../pdf_reader/pdf-inspector/solution.py --mode vanilla --model claude-sonnet-5
profile:
  model: claude-sonnet-5
  framework: pdf-inspector
timeout: 900
tasks:
  # Alias must equal the trapstreet task_id — it is what `tp submit` submits to.
  pdf-mixed-scan:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@6afe24b4173db4ffb4c83da81c7cc93ce8a50943#subdirectory=tasks/pdf_mixed_scan
