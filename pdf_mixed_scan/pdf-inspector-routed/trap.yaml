name: pdf-mixed-scan-pdf-inspector-routed
# pdf-inspector used as its README describes: classify per page, then route the
# pages it flags to a path that can read them. The plain pdf-inspector solution
# in this repo stops at extraction and never acts on the classification, so the
# pair isolates what the routing step is worth on this document.
#
# Model is a literal CLI argument, never an env var — profile.model below is
# self-reported and would drift from a MODEL env var silently.
cmd: uv run python solution.py --model claude-sonnet-5
profile:
  model: claude-sonnet-5
  framework: pdf-inspector
timeout: 900
tasks:
  # Alias must equal the trapstreet task_id — it is what `tp submit` submits to.
  pdf-mixed-scan:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@6afe24b4173db4ffb4c83da81c7cc93ce8a50943#subdirectory=tasks/pdf_mixed_scan
