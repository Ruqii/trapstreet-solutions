name: Jev, decomposed into 3 Noul questions
cmd: uv run ../solution.py --mode jev-decomposed-noul
profile:
  model: typesafe-jev-latest
  framework: jev-decomposed-noul
  notes: >-
    Same comment as jev-single-choice, but instead of one broad Noul
    question, three independent narrow Noul questions (personal insult,
    threat/incitement, group-targeted hate) run in parallel, combined via
    noisy-OR (1 - product(1 - p_i)). Tests TypeSafe's own guidance to keep
    each judgment narrow rather than one broad one.
timeout: 60
tasks:
  moderation-calibration:
    source: git+https://github.com/trapstreet/trapstreet-tasks@8976d7ee1e6cc26be5177145d2db3dd5fe6d8f65#subdirectory=tasks/moderation_calibration
