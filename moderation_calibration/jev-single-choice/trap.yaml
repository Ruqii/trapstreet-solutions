name: Jev, single Noul call
cmd: uv run ../solution.py --mode jev-single-choice
profile:
  model: typesafe-jev-latest
  framework: jev-single-choice
  notes: >-
    The judgment is outsourced entirely to Jev (jev-latest): one Noul
    question over the bare comment string, no decomposition, no Claude call
    for the decision itself. The simplest possible way to use the primitive.
timeout: 60
tasks:
  moderation-calibration:
    source: git+https://github.com/trapstreet/trapstreet-tasks@8976d7ee1e6cc26be5177145d2db3dd5fe6d8f65#subdirectory=tasks/moderation_calibration
