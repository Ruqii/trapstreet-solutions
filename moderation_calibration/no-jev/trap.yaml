name: claude-sonnet-5, no Jev
cmd: uv run ../solution.py --mode no-jev --model claude-sonnet-5
profile:
  model: claude-sonnet-5
  framework: no-jev
  notes: >-
    Floor arm: Claude Sonnet 5 reads task.md + comment.txt and produces the
    whole answer itself, no decision primitive involved. Compare against the
    jev-* arms, which hold the model constant and only change whether/how
    the judgment is outsourced to TypeSafe's Jev.
timeout: 120
tasks:
  moderation-calibration:
    source: git+https://github.com/trapstreet/trapstreet-tasks@8976d7ee1e6cc26be5177145d2db3dd5fe6d8f65#subdirectory=tasks/moderation_calibration
