name: pdf-inspector
# The text-layer floor, run here for what it does to the judge rather than for
# where it lands: it answers every figure question with some form of "I cannot
# see it", which is the input that stress-tests the abstention matchers. The
# point of those cases is that a reasoned refusal and a blind one are different
# answers, and this arm produces the blind one twenty-three times.
#
# The shared implementation ships a prompt naming the UK tenancy agreement it
# was written for; --system replaces it with neutral wording.
cmd: uv run python ../../pdf_reader/pdf-inspector/solution.py --mode vanilla --model claude-sonnet-5 --system "You answer questions about a document. You are given it as plain text extracted from the PDF; layout may be flattened and the extraction may contain errors. Answer only from the document. Commit to an answer rather than hedging when the document contains it. Follow any format the question asks for, and answer every part of a multi-part question."
profile:
  model: claude-sonnet-5
  framework: pdf-inspector
timeout: 900
tasks:
  pdf-chart-reasoning:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@0461051ab3e6636916fcfac1f8c4c8042efc5139#subdirectory=tasks/pdf_chart_reasoning
