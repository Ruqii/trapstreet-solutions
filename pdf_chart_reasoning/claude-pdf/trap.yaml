name: claude-pdf
# Run first as a check on the task rather than as a ranking: it is the cheapest
# arm on the board (the document goes as one cached prompt) and it still
# produces a real reply for all seven capabilities, which is what a smoke test
# of the cases and the judge needs.
#
# Model is a literal CLI argument, never an env var — profile.model below is
# self-reported and would drift from a MODEL env var silently.
cmd: uv run python ../../pdf_reader/claude-pdf/solution.py --model claude-sonnet-5 --system "You answer questions about a document, which you are given in full. Answer only from the document. Commit to an answer rather than hedging when the document contains it. Follow any format the question asks for, and answer every part of a multi-part question."
profile:
  model: claude-sonnet-5
  framework: anthropic-api
timeout: 900
tasks:
  pdf-chart-reasoning:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@0461051ab3e6636916fcfac1f8c4c8042efc5139#subdirectory=tasks/pdf_chart_reasoning
