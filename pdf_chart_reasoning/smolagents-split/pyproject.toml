[project]
name = "smolagents-split-chart"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "smolagents>=1.10.0",
    "litellm>=1.50.0",
    # Authorising an import the environment cannot satisfy is not a capability:
    # the agent's interpreter is told it may use these, so they have to be here.
    "pymupdf>=1.24",
    "pillow>=10.0",
    "numpy>=1.26",
]
