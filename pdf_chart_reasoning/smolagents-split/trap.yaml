# The only arm that picks its own method: a CodeAgent with a vision tool and a
# Python interpreter, planning on Sonnet 5 and looking with Opus 5. On the
# predecessor it never once reached for the interpreter -- 105 tool calls, zero
# imports -- and this task gives it more to reach for, since seven of its cases
# turn on the text pages rather than the figures.
#
# --answer-contract exists because smolagents' final_answer is a value channel:
# a bare "6" reaches stdout and a task grading on a sentinel scores it zero.
name: smolagents-split
cmd: "uv run python ../../pdf_reader/smolagents-split/solution.py --planner-model claude-sonnet-5 --tool-model claude-opus-5 --max-steps 12 --answer-contract ANSWER --allow-imports \"pymupdf,PIL,PIL.Image,numpy,math,statistics,json,re,collections,itertools\" --tool-system \"You look at a document and report what a figure shows. Answer exactly what is there. One short sentence; just the value if a value is asked for.\" --agent-prompt \"You answer one question about a document whose figures are pictures: the pages carrying them have no text layer and no vector paths, so no parser can read a value out of them. Some questions are about what the release says of its own figures, which is in the text pages and their footnotes.\n\nYou have:\n  - read_pdf(question): ask a focused question, a vision model looks at the document\n  - Python: compute, and whatever else you can do with the modules listed below\n\nRules:\n- Answer ONLY from the document.\n- Do not hedge if the document contains the answer; if it genuinely cannot, say so and say why.\n- What you pass to final_answer() is the whole of what gets graded, so it must itself end with a line of the form `ANSWER: <value>` -- a bare value loses the case.\n\nQUESTION: {question}\""
profile:
  model:
  - claude-sonnet-5
  - claude-opus-5
  framework: smolagents
timeout: 3600
tasks:
  pdf-chart-reasoning:
    source: git+https://github.com/trapstreet/trapstreet-tasks.git@0461051ab3e6636916fcfac1f8c4c8042efc5139#subdirectory=tasks/pdf_chart_reasoning
