name: gpt-terra
cmd: uv run solution.py --provider openai --model gpt-5.6-terra
profile:
  model: gpt-5.6-terra
  framework: openai-api
  notes: >-
    Bare relay: the brief goes to the model verbatim, no system prompt, no
    tools, no retries on content. One of three arms run to answer a single
    question - do the six deterministic cases separate frontier models at all.
timeout: 1800
tasks:
  frontend-silent-defects:
    source: ../../../trapstreet-tasks/unvalidated/frontend_silent_defects
  # The seven scored cases only. The three open briefs emit score: null, so they
  # cannot answer the question this probe exists to answer, and running them
  # would add half again to the bill. Rebuild with the snippet in README.md.
  scored-only:
    source: /private/tmp/claude-501/-Users-zhengruqi-Documents-Projects-trapstreet-tasks/8b527a96-6300-42b0-97ba-807f9043399d/scratchpad/task-scored
  # The three open briefs, for the judge-validation set.
  open:
    source: /private/tmp/claude-501/-Users-zhengruqi-Documents-Projects-trapstreet-tasks/8b527a96-6300-42b0-97ba-807f9043399d/scratchpad/task-open
