name: claude-code-deepseek-flash
cmd: python3 solution.py
profile:
  model: deepseek-flash
  framework: claude-code
  notes: >-
    Claude Code as shipped (not --bare), headless, on DeepSeek's
    Anthropic-format endpoint; every model slot set to deepseek-flash. Fresh
    config dir per case, WebSearch/WebFetch disallowed, no network. Launch
    with ../run-arm.sh, which sets the upstream the cost proxy needs.
timeout: 1800
tasks:
  dabstep:
    source: git+https://github.com/trapstreet/trapstreet-tasks@41c111ef0e3e7fde023f15bb8e8c15b48e0a6383#subdirectory=tasks/dabstep
