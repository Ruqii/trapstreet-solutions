name: mini-loop + claude-opus-5
cmd: uv run ../mini_loop.py --api anthropic --model claude-opus-5
profile:
  model: claude-opus-5
  framework: mini-loop
  notes: >-
    The simple harness: one run_python tool, at most 10 runs, then a final
    answer; no planning, sub-agents or context management (DABStep's ReAct
    baseline shape). Runs the same ../mini_loop.py as
    mini-loop + deepseek-flash, so only the model differs. Thinking at the
    vendor default; no refusal fallback; snippets run in a jail that reads only the case copy, with no network.
timeout: 1800
tasks:
  dabstep:
    source: git+https://github.com/trapstreet/trapstreet-tasks@e7e12e652aa2f31387968eb8623da14465a12263#subdirectory=tasks/dabstep
