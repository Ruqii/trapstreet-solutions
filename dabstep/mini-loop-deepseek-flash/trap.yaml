name: mini-loop + deepseek-flash
cmd: uv run ../mini_loop.py --api deepseek --model deepseek-flash
profile:
  model: deepseek-flash
  framework: mini-loop
  notes: >-
    The simple harness: one run_python tool, at most 10 runs, then a final
    answer; no planning, sub-agents or context management (DABStep's ReAct
    baseline shape). Runs the same ../mini_loop.py as mini-loop + claude-opus-5,
    so only the model differs. DeepSeek's OpenAI-format endpoint; thinking at
    the vendor default (on, effort high); snippets run in a jail that reads only the case copy, with no network.
timeout: 1800
tasks:
  dabstep:
    source: git+https://github.com/trapstreet/trapstreet-tasks@e7e12e652aa2f31387968eb8623da14465a12263#subdirectory=tasks/dabstep
