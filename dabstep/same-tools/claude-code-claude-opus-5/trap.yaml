name: claude-code + claude-opus-5
cmd: python3 ../../claude_code.py --model claude-opus-5 --key-env ANTHROPIC_API_KEY --same-tools
profile:
  model: claude-opus-5
  framework: claude-code
  notes: >-
    On the shared tool server (same-tools/tools.py: run_python, read_file, list_dir) and nothing else: this harness's own tools are off, and same-tools/probe_tools.py checks what it offered the model before the run is published. Same jail, same 1800 s, same cost proxy as every other arm. Claude Code as shipped otherwise (not --bare), headless, fresh config dir per case, Anthropic defaults (its own small model for side calls); the tools arrive over MCP with --strict-mcp-config.
timeout: 1800
tasks:
  dabstep-shared-tools:
    source: git+https://github.com/trapstreet/trapstreet-tasks@07993beb95ed63bd1e052d794f7c30b7d8a53712#subdirectory=tasks/dabstep
