# The model is a literal argument here and nowhere else, so what runs and what
# gets reported cannot drift apart. PERSONA stays an env var — it is the
# condition varied across runs of this identity, not the identity itself.
name: mbti-multi-model-glm-5.2
cmd: uv run ../solution.py --provider openrouter --model z-ai/glm-5.2
profile:
  model: z-ai/glm-5.2
  framework: openrouter
timeout: 600 # heavy reasoning models can take well over a minute

tasks:
  # Must stay equal to the commit registered on trapstreet — submit matches
  # {repo, commit, subdirectory} exactly and 404s on any mismatch.
  do-llms-dream-of-intj:
    source: git+https://github.com/trapstreet/trapstreet-tasks@cf92b6690b7c8b3430602dd3b72a8528c96e636b#subdirectory=tasks/personality/mbti_profile
